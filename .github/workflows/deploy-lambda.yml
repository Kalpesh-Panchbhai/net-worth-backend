name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-lambda

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn -B -q package -Dmaven.test.skip=true

      # Migrations run only when this push touched them; when that can't be told (a manual run, a new
      # branch, a force push) they run anyway, since migrate.sh skips what is already applied.
      - name: Check for migration changes
        id: migrations
        run: |
          before='${{ github.event.before }}'
          if [ '${{ github.event_name }}' = push ] && [ -n "$before" ] && [ "$before" != 0000000000000000000000000000000000000000 ] \
             && diff=$(git diff --name-only "$before" '${{ github.sha }}' -- scripts/migrations scripts/migrate.sh 2>/dev/null); then
            [ -n "$diff" ] && echo changed=true >> "$GITHUB_OUTPUT" || echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      # New scripts/migrations/*.sql run before the code that needs them is deployed; a failure stops the deploy.
      - name: Run migrations
        if: steps.migrations.outputs.changed == 'true'
        run: scripts/migrate.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::287750673296:role/github-networth-deploy
          aws-region: ap-south-1

      - name: Update functions
        run: |
          fns="NetWorthAPIFunction NetWorthSchedulerFunction NetWorthStockAlertFunction"
          pids=()
          for f in $fns; do
            ( aws lambda update-function-code --function-name "$f" \
                --zip-file fileb://target/net-worth-backend-1.0-SNAPSHOT.jar \
                --query '[FunctionName,LastModified]' --output text \
              && aws lambda wait function-updated --function-name "$f" ) &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
