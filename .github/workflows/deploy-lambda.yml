name: Deploy Lambdas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-lambda

jobs:
  # New scripts/migrations/*.sql run before the code that needs them is deployed; a failure stops the deploy.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: scripts/migrate.sh
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn -B -q package -Dmaven.test.skip=true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::287750673296:role/github-networth-deploy
          aws-region: ap-south-1

      - name: Update functions
        run: |
          fns="NetWorthAPIFunction NetWorthSchedulerFunction NetWorthStockAlertFunction"
          pids=()
          for f in $fns; do
            ( aws lambda update-function-code --function-name "$f" \
                --zip-file fileb://target/net-worth-backend-1.0-SNAPSHOT.jar \
                --query '[FunctionName,LastModified]' --output text \
              && aws lambda wait function-updated --function-name "$f" ) &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
